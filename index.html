<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AEGIS Mine Subsidence Early Warning System — Technical Handbook</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="AEGIS: Physics-Informed Real-Time Coal Mining Subsidence & Slope Stability Monitoring Platform (Format B Technical Handbook)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Docsify Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- KaTeX CSS for mathematical formulas -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>
  
  <style>
    :root {
      --theme-color: #0284c7;
      --heading-color: #0f172a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #334155;
    }
    .sidebar {
      background-color: #f8fafc;
      border-right: 1px solid #e2e8f0;
      font-size: 13.5px;
    }
    .sidebar ul li a {
      color: #475569;
      padding: 4px 0;
      transition: color 0.15s ease;
    }
    .sidebar ul li a:hover,
    .sidebar ul li.active > a {
      color: var(--theme-color);
      font-weight: 600;
    }
    .sidebar-nav strong {
      display: block;
      margin-top: 14px;
      margin-bottom: 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    .markdown-section {
      max-width: 960px;
      padding: 30px 48px;
    }
    .markdown-section h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
    }
    .markdown-section h2 {
      font-size: 1.45rem;
      font-weight: 600;
      color: #1e293b;
      margin-top: 32px;
    }
    .markdown-section h3 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #334155;
    }
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    .markdown-section table th {
      background-color: #f1f5f9;
      color: #0f172a;
      font-weight: 600;
    }
    .markdown-section code {
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9em;
    }
    .search input {
      border-radius: 6px;
      border: 1px solid #cbd5e1;
    }
  </style>
</head>
<body>
  <div id="app">Loading AEGIS Technical Handbook...</div>
  
  <script>
    window.$docsify = {
      name: 'AEGIS Handbook (SIH 2026)',
      repo: 'https://github.com/lively-life7/SIH-Documentation',
      homepage: 'README.md',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search 48 handbook chapters...',
        noData: 'No matching documentation found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous Module',
        nextText: 'Next Module',
        crossChapter: true
      }
    }
  </script>
  
  <!-- Core Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Full-Text Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy to Clipboard -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- KaTeX Math Rendering -->
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <!-- Prism Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
</body>
</html>
